workflows:
  electron-desktop-build:
    name: Build Discord Token Desktop App
    max_build_duration: 30
    environment:
      node: latest
      groups:
        - discord_secrets
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Build Application
        script: |
          npm run build
    artifacts:
      - dist/*.exe
      - dist/*.dmg
      - dist/*.AppImage
      - dist/*.zip
    publishing:
      email:
        recipients:
          - your_email@example.com
        notify:
          success: true
          failure: true
