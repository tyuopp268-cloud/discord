
workflows:
  android-apk:
    name: Discord App Android APK
    max_build_duration: 60

    instance_type: mac_mini_m2

    environment:
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web application
        script: |
          npm run build

      - name: Create Android project
        script: |
          npx cap add android

      - name: Sync Android
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      
